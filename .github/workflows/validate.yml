name: Validate read-only mini program

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-and-mock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check registered pages and run mock regression tests
        run: node tests/validate.cjs
